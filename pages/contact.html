<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/fonts.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contact.css">
    <script src="../js/script.js" defer></script>
    <script src="../js/contact.js" defer></script>
    <title>Silas Wollston - Contact</title>
</head>
<body>
    <nav class="subtle-shadow"></nav>
    <div class="background-image">
        <div class="gradient"></div>
        <img src="../assets/background.png" alt="">
    </div>
    <div class="padding-10 top"></div>
    <div class="info-container biography-container default-component contact-container">
        <form>
            <input type="hidden" name="access_key" value="c3480a76-725e-41c2-ae5f-b08247679ea0">
            <input type="hidden" name="from_name" value="silaswollston.com">
            <input type="text" name="name" placeholder="Name" class="form-input-name">
            <input type="email" name="email" placeholder="Email Address" class="form-input-email">
            <textarea name="message" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" class="form-input-message"></textarea>
            <input type="submit" value="Submit" class="form-input-submit">
        </form>
        <div class="image gradient-outline default-component reversed"></div>
    </div>
    <div class="pop-up-container form-result hidden no-anim">
        <span>Your message has been submitted!</span>
        <button class="continue-reading standard-outline">Go Back</button>
    </div>
    <script>
        const form = document.querySelector('form');
        const result = document.querySelector('.pop-up-container');
        const message = result.querySelector('span')

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            const name = formData.get('name');
            const subject = `${name} completed your contact form`;

            formData.append('subject', subject);
            
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status !== 200) {
                    console.log(response);
                    message.textContent = json.message;
                }
            })
            .catch(error => {
                console.log(error);
                result.innerHTML = "Something went wrong!";
            })
            .then(function() {
                form.reset();
                result.classList.remove('hidden');
                result.querySelector('button').onclick = () => {result.classList.add('hidden')}
            });
        });
    </script>
</body>
</html>
